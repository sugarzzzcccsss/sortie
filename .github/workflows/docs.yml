# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: Docs

on:
  push:
    branches: [validation/claude-background-docs-20261027-2218]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 87f4ed88112fe8c9e64868dd44d25b4d702d7995
          persist-credentials: false

      - name: Install lychee
        uses: sortie-ai/shared-workflows/.github/actions/setup-lychee@6d471deb70b0fee52d42366fb84f76b95d8f957a # v1.2.0

      - name: Check links and anchors
        env:
          EVENT: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            schedule|workflow_dispatch) make lint-docs LYCHEE_FLAGS= ;;
            *) make lint-docs ;;
          esac
